name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend y web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # El cliente Prisma se genera desde el esquema; sin él no compilan los tipos.
      - run: pnpm --filter @imvoces/db exec prisma generate
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder

      # Los paquetes se construyen en orden de dependencia antes de tipar las apps.
      - run: pnpm --filter @imvoces/contracts build
      - run: pnpm --filter @imvoces/db exec tsc -p tsconfig.json
      - run: pnpm --filter @imvoces/providers build

      - name: Typecheck
        run: |
          pnpm --filter @imvoces/api exec tsc --noEmit -p tsconfig.json
          pnpm --filter @imvoces/worker exec tsc --noEmit -p tsconfig.json
          pnpm --filter @imvoces/web exec tsc --noEmit

      - name: Tests de proveedores
        run: node --test --experimental-strip-types packages/providers/src/paths.test.ts

      - name: Build de la web
        run: pnpm --filter @imvoces/web build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  android:
    name: APK de Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

      # El keystore de firma llega por secrets; sin él el build sale firmado en
      # debug, que sirve para probar pero no para distribuir.
      - name: Restaurar keystore
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/imvoces.jks
          cat > android/key.properties <<EOP
          storeFile=imvoces.jks
          storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOP

      # --split-per-abi genera un APK por arquitectura: ~40% menos de tamaño.
      - name: Compilar APK
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=${{ vars.API_BASE_URL || 'https://api.example.com' }} \
            --dart-define=GOOGLE_SERVER_CLIENT_ID=${{ vars.GOOGLE_SERVER_CLIENT_ID }}

      - uses: actions/upload-artifact@v4
        with:
          name: imvoces-apk
          path: apps/mobile/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
