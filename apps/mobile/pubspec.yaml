name: imvoces_filemanager
description: Gestor de archivos multi-nube ImVoces — cliente Android.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.6.1
  dio: ^5.7.0
  google_sign_in: ^6.2.2
  flutter_secure_storage: ^9.2.2
  url_launcher: ^6.3.1
  flutter_local_notifications: ^18.0.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
