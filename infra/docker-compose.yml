# Servicios de apoyo para desarrollo local.
#
# PostgreSQL NO está aquí: el proyecto usa el servidor remoto 74.208.99.84,
# configurado con DATABASE_URL. Este compose solo levanta lo que hace falta
# en la máquina del desarrollador.
services:
  redis:
    image: redis:7-alpine
    container_name: imvoces-redis
    command: ['redis-server', '--appendonly', 'yes']
    ports: ['6379:6379']
    volumes: ['redis-data:/data']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5

  # MinIO: S3 local para probar el driver sin gastar cuota de R2.
  # Los tests del paquete providers apuntan aquí.
  minio:
    image: minio/minio:latest
    container_name: imvoces-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ['9000:9000', '9001:9001']
    volumes: ['minio-data:/data']
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-data:
  minio-data:
